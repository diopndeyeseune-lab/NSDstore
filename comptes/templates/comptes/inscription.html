{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
    <h1>Créer un compte</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">S'inscrire</button>
    </form>
    <p class="lien-auth-croise">Vous avez déjà un compte ? <a href="{% url 'comptes:login' %}">Se connecter</a></p>
{% endblock %}
