{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
    <p class="lien-auth-croise">Vous n'avez pas encore de compte ? <a href="{% url 'comptes:inscription' %}">S'inscrire</a></p>
{% endblock %}
